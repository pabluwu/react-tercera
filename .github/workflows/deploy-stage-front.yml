name: Deploy React Frontend to VPS

on:
  push:
    branches:
      - test
      - main  # Ahora escucha tanto a test (Stage) como a main (Prod)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar variables dinámicas según la rama
    - name: Configurar variables de entorno de despliegue
      id: set-env
      run: |
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "VITE_API=https://api.terceraquillota.cl/api/" >> $GITHUB_OUTPUT
          echo "TARGET_DIR=/var/www/prod-front" >> $GITHUB_OUTPUT
        else
          echo "VITE_API=http://test-api.terceraquillota.cl/api/" >> $GITHUB_OUTPUT
          echo "TARGET_DIR=/var/www/stage-front" >> $GITHUB_OUTPUT
        fi

    # 3. Configurar Node.js
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # 4. Instalar dependencias respetando el lockfile
    - name: Instalar dependencias
      run: npm ci

    # 5. Compilar el proyecto inyectando la API dinámicamente
    - name: Compilar proyecto
      env:
        VITE_API_URL: ${{ steps.set-env.outputs.VITE_API }}
        CI: false
      run: npm run build

    # 6. Subir los archivos estáticos compilados a la carpeta correcta del VPS
    - name: Sincronizar archivos con el VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        # Nota: Si tu proyecto usa Vite, la carpeta suele ser "dist/". 
        # Si usa Create React App, cámbialo a "build/" como lo tenías antes.
        source: "dist/" 
        target: ${{ steps.set-env.outputs.TARGET_DIR }}
        strip_components: 1